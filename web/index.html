<!doctype html>

<html lang="zh-Hant">
<head>

  <title>H0 Lab</title>
  <meta name="description" content="H0 Lab:開源的量化選股研究平台。查個股、建立自己的選股模型,並用不偷看未來的回測誠實驗證。">

<body>
  <!-- 全站外框(階段 3 D3 第 2 部分):電腦 macOS 側邊欄 + 工具列;手機 iOS 底部標籤列。元素 id 沿用,app.js 依賴它們 -->
  <div class="u-shell app-shell">
    <nav class="u-side" aria-label="主要導覽">
      <button class="u-nav app-brand" id="brand" aria-label="H0 Lab 首頁"><span class="logo" aria-hidden="true"><img src="/static/img/h0-logo.svg" alt="" width="30" height="30"></span><span class="app-brand-t">H0 Lab<small>量化選股研究</small></span></button>
      <h2>研究</h2>
      <button class="u-nav" id="navHome" data-route=""><span class="u-ic" data-ic="home" aria-hidden="true">◉</span>首頁</button>
      <button class="u-nav" id="navScan" data-route="scan"><span class="u-ic" data-ic="scan" aria-hidden="true">≡</span>選股掃描</button>
      <div id="sideWatch" aria-label="觀察清單"></div>
      <h2>模型</h2>
      <button class="u-nav" id="navWizard" data-route="wizard"><span class="u-ic" data-ic="wizard" aria-hidden="true">✦</span><span id="navWizardTxt">建立模型</span></button>
      <button class="u-nav" id="navModels" data-route="models"><span class="u-ic" data-ic="models" aria-hidden="true">⚖</span>模型工作台</button>
      <h2>驗證</h2>
      <button class="u-nav" id="navBacktest" data-route="backtest"><span class="u-ic" data-ic="backtest" aria-hidden="true">◎</span>研究紀錄</button>
      <button class="u-nav" id="navLab" data-route="lab"><span class="u-ic" data-ic="lab" aria-hidden="true">◇</span>因子研究</button>
      <!-- 預測追蹤(review)與模擬投資組合(paper)暫停顯示:目前用內建模型的評等,下一版重接到使用者模型(程式碼保留) -->
      <h2>工具</h2>
      <button class="u-nav" id="navMethod" data-route="method"><span class="u-ic" data-ic="method" aria-hidden="true">ⓘ</span>方法與資料</button>
      <div class="app-side-foot">
        <button class="u-nav" id="navTheme" hidden title="切換外觀"><span class="u-ic" data-ic="theme" aria-hidden="true">◑</span><span id="navThemeTxt">外觀:跟系統</span></button>
        <button class="u-nav" id="navLang" hidden title="切換語言"><span class="u-ic" data-ic="globe" aria-hidden="true">文</span><span id="navLangTxt">English</span></button>
        <button class="u-nav" id="navColor" hidden title="切換漲跌配色"><span class="u-ic" data-ic="colors" aria-hidden="true">◐</span><span id="navColorTxt">漲跌配色:紅漲綠跌</span></button>
        <div class="sys app-sys" id="sys" title="資料服務狀態"><span class="live-dot"></span><span id="sysTxt">資料服務正常</span></div>
      </div>
    </nav>
    <div class="u-main">
      <header class="u-toolbar">
        <span class="app-navbtns"><button class="app-icbtn" id="navBack" aria-label="上一頁" title="上一頁"><span data-ic="back" aria-hidden="true">‹</span></button><button class="app-icbtn" id="navFwd" aria-label="下一頁" title="下一頁"><span data-ic="forward" aria-hidden="true">›</span></button></span>
        <span class="u-title" id="tbTitle">首頁</span>
        <span class="u-sp"></span>
        <span class="app-clock" id="mkClock" aria-label="市場開盤狀態"></span>
        <div class="search" id="topSearch">
          <span class="icon" data-ic="search" aria-hidden="true">⌕</span>
          <kbd class="app-kbd" aria-hidden="true">/</kbd>
          <input id="q" type="text" autocomplete="off" spellcheck="false" aria-label="搜尋公司" placeholder="搜尋公司或代號">
          <div class="dropdown" id="dd"></div>
        </div>
        <button class="app-cmdk" id="cmdK" title="指令面板:找公司、跳頁、執行動作" aria-label="開啟指令面板">⌘K</button>
      </header>
      <main id="app" class="u-content"></main>
  <!-- 全站「非投資建議」聲明的靜態備援:JS 載入失敗也看得到;app.js 會沿用這個元素(同一個 id),不會出現兩份 -->
  <footer id="siteDisclaimer" class="site-disclaimer" role="contentinfo">H0 Lab 是開源的研究工具,不是證券投資顧問。所有分數、等級與回測結果都是模型輸出,不構成投資建議,也不保證任何報酬;資料可能有誤。</footer>
    </div>
    <nav class="u-tabbar" aria-label="主要導覽">
      <button class="u-tab" data-route=""><span class="u-ic" aria-hidden="true">◉</span>首頁</button>
      <button class="u-tab" data-route="scan"><span class="u-ic" aria-hidden="true">≡</span>掃描</button>
      <button class="u-tab" data-route="wizard"><span class="u-ic" aria-hidden="true">✦</span>建模型</button>
      <button class="u-tab" id="tabMore"><span class="u-ic" aria-hidden="true">⋯</span>更多</button>
    </nav>
  </div>
  <div class="tip" id="tip"></div>
  <script src="/static/vendor/echarts-5.6.0.min.js"></script>
  <script type="module" src="/static/js/app.js"></script>
  <script type="module" src="/static/js/update.js"></script>
</body>
</html>
