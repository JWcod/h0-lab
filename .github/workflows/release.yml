name: Release

# 只在推 v* tag 時執行;產出的是 draft release,由人手動按發布(packaging/README.md)
on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  PYTHON_VERSION: "3.13"

jobs:
  test:
    name: 測試(離線)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      INVEST_LAB_OFFLINE: "1"
      INVEST_LAB_RECORD: "0"
      INVEST_LAB_AGENT: ci
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: 建立本機 main 分支(預先登記檢查要讀)
        run: git rev-parse --verify -q refs/heads/main || git branch main origin/main
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: 暫存資料夾
        run: |
          echo "INVEST_LAB_PRIVATE_DIR=${RUNNER_TEMP}/invest_lab/private" >> "$GITHUB_ENV"
          echo "INVEST_LAB_OUT_DIR=${RUNNER_TEMP}/invest_lab/out" >> "$GITHUB_ENV"
          mkdir -p "${RUNNER_TEMP}/invest_lab/private" "${RUNNER_TEMP}/invest_lab/out"
      - name: 安裝套件
        env:
          INVEST_LAB_OFFLINE: "0"
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.lock.txt "ruff==0.15.22" "pytest==9.2.0"
      - run: ruff check .
      - run: python -m pytest -q -rs

  build:
    name: 打包(Apple Silicon)
    needs: test
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: 版本要和 tag 一致
        env:
          TAG: ${{ github.ref_name }}
        run: |
          VERSION="$(python -c 'import re,pathlib;print(re.search(r"__version__ = \"(.+?)\"", pathlib.Path("lab/version.py").read_text()).group(1))')"
          test "v${VERSION}" = "${TAG}" || { echo "::error::tag ${TAG} 和 lab/version.py 的 ${VERSION} 不一致"; exit 1; }
          echo "VERSION=${VERSION}" >> "$GITHUB_ENV"
      - name: 安裝打包工具(獨立環境)
        run: |
          python -m venv "${RUNNER_TEMP}/bvenv"
          "${RUNNER_TEMP}/bvenv/bin/python" -m pip install -r requirements.lock.txt -r packaging/requirements-build.txt
      - name: 第三方授權清單
        run: |
          "${RUNNER_TEMP}/bvenv/bin/python" packaging/release_tools.py notices --out-dir "${RUNNER_TEMP}/out"
      - name: 打包並 ad-hoc 簽章
        run: |
          "${RUNNER_TEMP}/bvenv/bin/python" packaging/build_app.py --out "${RUNNER_TEMP}/out" --require-key \
            --notices "${RUNNER_TEMP}/out/THIRD_PARTY_NOTICES.txt"
      - name: 發布前檢查(不是測試版、公鑰與版本正確、能啟動)
        run: |
          "${RUNNER_TEMP}/bvenv/bin/python" packaging/release_tools.py check-app "${RUNNER_TEMP}/out/dist/H0 Lab.app" --version "${VERSION}"
          "${RUNNER_TEMP}/bvenv/bin/python" packaging/release_tools.py check-portable "${RUNNER_TEMP}/out/dist/H0 Lab.app"
          "${RUNNER_TEMP}/out/dist/H0 Lab.app/Contents/MacOS/H0 Lab" --self-test
      # 公證(預留):四個 Apple secret 都設好才執行;沒設就維持 ad-hoc,流程照跑
      - name: Apple 簽章與公證(有憑證才執行)
        env:
          APPLE_CERT_P12_BASE64: ${{ secrets.APPLE_CERT_P12_BASE64 }}
          APPLE_CERT_PASSWORD: ${{ secrets.APPLE_CERT_PASSWORD }}
          APPLE_SIGN_IDENTITY: ${{ secrets.APPLE_SIGN_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: |
          if [ -z "${APPLE_CERT_P12_BASE64}" ] || [ -z "${APPLE_CERT_PASSWORD}" ] || [ -z "${APPLE_SIGN_IDENTITY}" ] || [ -z "${APPLE_ID}" ] || [ -z "${APPLE_TEAM_ID}" ] || [ -z "${APPLE_APP_PASSWORD}" ]; then
            echo "沒有 Apple 憑證 secrets,略過公證(維持 ad-hoc 簽章)"
            exit 0
          fi
          KEYCHAIN="${RUNNER_TEMP}/release.keychain-db"
          KEYCHAIN_PW="$(openssl rand -base64 24)"
          security create-keychain -p "${KEYCHAIN_PW}" "${KEYCHAIN}"
          security set-keychain-settings -lut 3600 "${KEYCHAIN}"
          security unlock-keychain -p "${KEYCHAIN_PW}" "${KEYCHAIN}"
          echo "${APPLE_CERT_P12_BASE64}" | base64 --decode > "${RUNNER_TEMP}/cert.p12"
          security import "${RUNNER_TEMP}/cert.p12" -k "${KEYCHAIN}" -P "${APPLE_CERT_PASSWORD}" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "${KEYCHAIN_PW}" "${KEYCHAIN}" >/dev/null
          security list-keychains -d user -s "${KEYCHAIN}" login.keychain-db
          rm -f "${RUNNER_TEMP}/cert.p12"
          "${RUNNER_TEMP}/bvenv/bin/python" packaging/build_app.py --out "${RUNNER_TEMP}/out" --require-key \
            --notices "${RUNNER_TEMP}/out/THIRD_PARTY_NOTICES.txt" --identity "${APPLE_SIGN_IDENTITY}"
          APP="${RUNNER_TEMP}/out/dist/H0 Lab.app"
          ZIP="${RUNNER_TEMP}/out/notarize.zip"
          /usr/bin/ditto -c -k --norsrc --keepParent "${APP}" "${ZIP}"
          xcrun notarytool submit "${ZIP}" --apple-id "${APPLE_ID}" --team-id "${APPLE_TEAM_ID}" --password "${APPLE_APP_PASSWORD}" --wait
          xcrun stapler staple "${APP}"
          rm -f "${ZIP}"
          # 公證後的 App 重新打包(stapler 改了內容)
          "${RUNNER_TEMP}/bvenv/bin/python" - <<'PY'
          import os, sys
          from pathlib import Path
          sys.path.insert(0, "packaging")
          import build_app
          out = Path(os.environ["RUNNER_TEMP"]) / "out"
          build_app.package(out / "dist" / build_app.APP, out)
          PY
          "${RUNNER_TEMP}/bvenv/bin/python" packaging/release_tools.py check-app "${APP}" --version "${VERSION}"
          "${APP}/Contents/MacOS/H0 Lab" --self-test
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: build
          if-no-files-found: error
          retention-days: 7
          path: |
            ${{ runner.temp }}/out/*.zip
            ${{ runner.temp }}/out/*.dmg
            ${{ runner.temp }}/out/THIRD_PARTY_NOTICES.txt

  draft-release:
    name: 簽章並建立 draft release
    needs: build
    runs-on: macos-15
    timeout-minutes: 15
    # 簽章私鑰放在這個 Environment:設定成要人工批准、只允許 v* tag(packaging/README.md)
    environment: release
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: tag 要在 main 上
        run: git merge-base --is-ancestor "${GITHUB_SHA}" origin/main || { echo "::error::這個 tag 不在 main 上,不簽章"; exit 1; }
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: ${{ runner.temp }}/artifacts
          merge-multiple: true
      - name: 安裝簽章工具(只有 cryptography,鎖 hash;私鑰環境不放其他套件)
        run: python -m pip install --require-hashes --no-deps -r packaging/requirements-sign.txt
      - name: 產生 manifest
        env:
          TAG: ${{ github.ref_name }}
        run: python packaging/release_tools.py manifest --version "${TAG#v}" --asset "arm64=${RUNNER_TEMP}/artifacts/H0-Lab-macOS-update.zip" --out "${RUNNER_TEMP}/artifacts/update-manifest.json"
      - name: 簽章(私鑰只在這一步)
        env:
          H0_UPDATE_SIGNING_KEY: ${{ secrets.H0_UPDATE_SIGNING_KEY }}
        run: python packaging/release_tools.py sign "${RUNNER_TEMP}/artifacts/update-manifest.json"
      - name: 產生 checksums
        run: python packaging/release_tools.py checksums "${RUNNER_TEMP}/artifacts"
      - name: 建立 draft release(不會公開,等人手動發布)
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release create "${TAG}" --draft --verify-tag --title "H0 Lab ${TAG}" --generate-notes "${RUNNER_TEMP}"/artifacts/*
