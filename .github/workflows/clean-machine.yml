name: Clean machine test

# Manual only. Builds the DMG, then installs and starts it on fresh macOS runners as a new user would.
# Logs are public once the repo is public: the test script prints pass or fail and counts, never downloaded data,
# and nothing except the DMG is uploaded, so third-party data stays on the runner.
on:
  workflow_dispatch:
    inputs:
      online:
        description: "macos-15 also downloads a small data set (about 180 requests) and opens a first report"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: clean-machine
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.13"

jobs:
  build:
    name: Build DMG
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install build tools (separate environment)
        run: |
          python -m venv "${RUNNER_TEMP}/bvenv"
          "${RUNNER_TEMP}/bvenv/bin/python" -m pip install -r requirements.lock.txt -r packaging/requirements-build.txt
      - name: Third-party notices
        run: |
          "${RUNNER_TEMP}/bvenv/bin/python" packaging/release_tools.py notices --out-dir "${RUNNER_TEMP}/out"
      - name: Build and ad-hoc sign
        run: |
          "${RUNNER_TEMP}/bvenv/bin/python" packaging/build_app.py --out "${RUNNER_TEMP}/out" --require-key \
            --notices "${RUNNER_TEMP}/out/THIRD_PARTY_NOTICES.txt"
      - name: Check the App runs on the stated macOS version and needs nothing outside itself
        run: |
          "${RUNNER_TEMP}/bvenv/bin/python" packaging/release_tools.py check-portable "${RUNNER_TEMP}/out/dist/H0 Lab.app"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: dmg
          if-no-files-found: error
          retention-days: 1
          path: ${{ runner.temp }}/out/*.dmg

  install:
    name: Install on ${{ matrix.os }}
    needs: build
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, macos-26]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: dmg
          path: ${{ runner.temp }}/dmg
      - name: Hide developer tools a normal Mac does not have
        run: |
          for p in /opt/homebrew /Library/Frameworks/Python.framework "${RUNNER_TOOL_CACHE:-/nonexistent}"; do
            if [ -e "$p" ]; then sudo mv "$p" "$p.hidden" && echo "hidden: $p"; fi
          done
      - name: Install and start
        env:
          ONLINE: ${{ inputs.online && matrix.os == 'macos-15' }}
        run: |
          MODE=offline
          if [ "$ONLINE" = "true" ]; then MODE=online; fi
          sh packaging/clean_machine_test.sh "${RUNNER_TEMP}/dmg/H0-Lab-macOS.dmg" "$MODE"
