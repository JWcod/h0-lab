name: CI

# The pull_request event gives code from forks a read-only token and no secrets. Do not switch to the target variant.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: ruff + pytest (${{ matrix.os }}, Python 3.13, offline)
    # While the repo is private, macOS minutes are limited, so dependency bump PRs skip CI. Public repos run everything.
    if: ${{ !(github.event.repository.private && github.actor == 'dependabot[bot]') }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest]
    env:
      # Always offline: tests use no network and write no forward record. Private and output folders go to the runner's temp area.
      INVEST_LAB_OFFLINE: "1"
      INVEST_LAB_RECORD: "0"
      INVEST_LAB_AGENT: ci
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - name: Check out
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
          # lab/research/prereg.py reads docs/預先登記.md from the main branch
          fetch-depth: 0

      - name: Create local main branch
        run: git rev-parse --verify -q refs/heads/main || git branch main origin/main

      - name: Set up Python 3.13
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            requirements.lock.txt
            requirements.txt

      - name: Temp folders (fake private, output)
        run: |
          echo "INVEST_LAB_PRIVATE_DIR=${RUNNER_TEMP}/invest_lab/private" >> "$GITHUB_ENV"
          echo "INVEST_LAB_OUT_DIR=${RUNNER_TEMP}/invest_lab/out" >> "$GITHUB_ENV"
          mkdir -p "${RUNNER_TEMP}/invest_lab/private" "${RUNNER_TEMP}/invest_lab/out"

      - name: Install dependencies
        # Offline mode only applies when lab is imported; installing needs the network
        env:
          INVEST_LAB_OFFLINE: "0"
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.lock.txt
          python -m pip install "ruff==0.15.22" "pytest==9.2.0"

      - name: Lint (ruff)
        run: ruff check .

      - name: Fast tests (pytest, excludes slow; tests that need data/ skip)
        run: python -m pytest -q -rs
